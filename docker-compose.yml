version: "3.8"
services:
  chroma:
    image: chromadb/chromadb:latest
    environment:
      - CHROMA_SERVER_DB_IMPL=duckdb+parquet
      - CHROMA_SERVER_ALLOW_RESET=true
    ports:
      - "8001:8000"
    volumes:
      - ./chroma_db:/chroma_db
  app:
    build: .
    env_file:
      - .env
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      - chroma
